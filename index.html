<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IB 理科 7 分手册</title>
<meta name="description" content="面向国际学校中文学生的 IB 理科学习笔记与资源">
<style>
:root {
  --bg: #F6F4EF;
  --surface: #FFFFFF;
  --line: #E1DED6;
  --muted: #7C7F86;
  --ink: #1B2440;      /* 深蓝强调色 */
  --text: #2B2D33;
  --serif: "Anthropic Serif", "Source Han Serif SC", "Noto Serif CJK SC", "Noto Serif SC", "Songti SC", "STSong", "SimSun", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#1A1D24; --surface:#22262F; --line:#343946; --muted:#9A9EA8; --ink:#DCE3F5; --text:#E6E6E9; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--serif);
  line-height: 1.9;
  -webkit-font-smoothing: antialiased;
}
main { max-width: 680px; margin: 0 auto; padding: 14vh 24px 8vh; }
h1 {
  margin: 0;
  font-size: clamp(2rem, 7vw, 3rem);
  font-weight: 600;
  letter-spacing: .12em;
  color: var(--ink);
  line-height: 1.3;
}
.sub { margin: 18px 0 0; color: var(--muted); font-size: 1rem; letter-spacing: .06em; }
section { margin-top: 72px; }
h2 {
  margin: 0 0 16px;
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: .1em;
  color: var(--muted);
}
.resource {
  display: block;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 24px 26px;
}
.resource h3 { margin: 0; font-size: 1.25rem; color: var(--ink); font-weight: 600; letter-spacing: .04em; }
.resource p { margin: 6px 0 18px; color: var(--muted); font-size: .95rem; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; }
.btn {
  font-family: inherit;
  font-size: .95rem;
  letter-spacing: .06em;
  padding: 9px 22px;
  border-radius: 999px;
  border: 1px solid var(--ink);
  text-decoration: none;
  cursor: pointer;
  transition: background .2s, color .2s;
}
.btn.primary { background: var(--ink); color: var(--bg); }
.btn.ghost { background: transparent; color: var(--ink); }
.btn:hover { opacity: .85; }
button.btn { line-height: inherit; }
.links { display: flex; flex-wrap: wrap; gap: 12px; }
.links a {
  color: var(--ink);
  text-decoration: none;
  border-bottom: 1px solid var(--ink);
  padding-bottom: 2px;
  letter-spacing: .06em;
}
.links a:hover { opacity: .7; }
a:focus-visible, .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
footer { margin-top: 96px; color: var(--muted); font-size: .85rem; letter-spacing: .05em; }

.follow { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.channel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px 22px 24px; }
.channel h3 { margin: 0 0 10px; font-size: 1.1rem; font-weight: 600; color: var(--ink); letter-spacing: .06em; }
.channel .links { flex-direction: column; gap: 6px; }
.channel h3 { display: flex; align-items: center; gap: 10px; }
.ico { flex: none; }
.channel .links a { align-self: flex-start; }
.qr { display: block; width: 100%; max-width: 180px; height: auto; background: #fff; padding: 8px; border-radius: 8px; border: 1px solid var(--line); }
.hint { margin: 8px 0 0; color: var(--muted); font-size: .8rem; letter-spacing: .04em; }
@media (max-width: 560px) { .follow { grid-template-columns: 1fr; } }
.proof { margin-top: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; }
.proof img { width: 100%; height: auto; display: block; border-radius: 6px; background: #fff; }
.bio { margin: 40px 0 0; color: var(--text); font-size: 1.05rem; letter-spacing: .05em; line-height: 2; }
</style>
</head>
